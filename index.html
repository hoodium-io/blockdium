<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Blockdium — block explorer for the Hoodium chain, built around Proof of Network Activity."
    />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="canonical" href="https://explorer.hoodium.dev/" />

    <!--
      Social preview tags. Without these, sharing the link shows a bare URL with no title or
      image — the first impression of a public explorer. `og:url` and the canonical above
      must be updated if the production domain differs.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blockdium" />
    <meta property="og:title" content="Blockdium — Hoodium Block Explorer" />
    <meta
      property="og:description"
      content="Explore Hoodium blocks, transactions and addresses, with Proof of Network Activity shown per block."
    />
    <meta property="og:url" content="https://explorer.hoodium.dev/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Blockdium — Hoodium Block Explorer" />
    <meta
      name="twitter:description"
      content="Explore Hoodium blocks, transactions and addresses, with Proof of Network Activity shown per block."
    />

    <title>Blockdium — Hoodium Block Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
