<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Blockdium">
  <!--
    Blockdium mark: a block outline with an ascending activity ladder inside.

    Outer shape = BLOCK (this is a block explorer). Inner bars = the PoNA activity ladder,
    which is the one thing that distinguishes Hoodium from any other chain. Drawn as filled
    rectangles rather than strokes so it stays legible at 16x16, where favicons are actually
    seen.
  -->
  <rect width="32" height="32" rx="7" fill="#0b0f14"/>
  <rect x="6.5" y="6.5" width="19" height="19" rx="4.5" fill="#121821" stroke="#4cc2ff" stroke-width="2"/>
  <rect x="11" y="18" width="2.6" height="4.4" rx="0.6" fill="#55636f"/>
  <rect x="14.8" y="15" width="2.6" height="7.4" rx="0.6" fill="#3d8b7d"/>
  <rect x="18.6" y="11" width="2.6" height="11.4" rx="0.6" fill="#4cc2ff"/>
</svg>
